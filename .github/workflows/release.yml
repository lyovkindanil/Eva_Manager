name: Выпуск

# Тег v1.2.3 → выпуск на GitHub с архивами для amd64 и arm64 (панель,
# Xray, systemd-юнит, install.sh) и checksums.txt — их ставит install.sh.
# Тег можно запушить из git или создать прямо на GitHub: Releases → Draft a
# new release → тег v1.2.3 → Publish; архивы добавятся к этому выпуску.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# Тег, запушенный вместе с выпуском, запускает оба события — сборка одна.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Интерфейс
        run: cd web && npm ci && npm run build
      - name: Архивы
        run: |
          v=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            scripts/dist.sh "$v" "$arch" dist
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Выпуск, созданный на GitHub вручную, уже есть — дополняем его.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            pre=
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $pre
          fi
