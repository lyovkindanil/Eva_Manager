name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (SQLite, PostgreSQL, Xray)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eva
          POSTGRES_PASSWORD: eva
          POSTGRES_DB: eva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      # Та же версия и та же проверка SHA-256, что в Docker-образе.
      - name: Xray
        run: scripts/fetch-xray.sh "$(cat XRAY_VERSION)" "$RUNNER_TEMP/xray"
      - name: go test
        env:
          EVA_TEST_POSTGRES_URL: postgres://eva:eva@127.0.0.1:5432/eva_test?sslmode=disable
          EVA_TEST_XRAY_BIN: ${{ runner.temp }}/xray/xray
        run: go test -race -count=1 -v ./... 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      # Настоящие интерфейсы AmneziaWG: процесс awg-run, NAT в iptables
      # раннера (с политикой FORWARD DROP от Docker), перезапуск при падении.
      - name: AmneziaWG (root)
        run: sudo -E env "PATH=$PATH" go test -count=1 -v -run 'TestRun$|TestAWGServer' ./internal/awg/ ./internal/e2e/ 2>&1 | tee awg.log; exit "${PIPESTATUS[0]}"
      # Тесты с PostgreSQL и Xray не должны тихо пропускаться.
      - name: Ничего не пропущено
        run: |
          # TestVPN4EvaClient и TestVPN4EvaAWG нужен vpn4eva-bench из
          # приватного репозитория клиента — в CI его нет, тесты
          # запускаются локально. TestRun и TestAWGServer без root
          # пропускаются и идут отдельным шагом через sudo.
          if grep -E -- '--- SKIP' test.log | grep -v -E 'TestVPN4EvaClient|TestVPN4EvaAWG|TestRun |TestAWGServer'; then
            echo "::error::есть пропущенные тесты"
            exit 1
          fi
          if grep -E -- '--- SKIP' awg.log || ! grep -q -- '--- PASS: TestRun ' awg.log || ! grep -q -- '--- PASS: TestAWGServer' awg.log; then
            echo "::error::тесты AmneziaWG с root не прошли полностью"
            exit 1
          fi

  web:
    name: Интерфейс
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Сборка
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t eva-manager:ci .
      # Образ запускается, Xray поднимается от непривилегированного
      # пользователя и отвечает по API.
      - name: Запуск
        run: |
          docker run -d --name eva -p 127.0.0.1:8080:8080 eva-manager:ci
          for i in $(seq 1 30); do
            # API под токеном администратора: без него — 401.
            if tok=$(docker exec eva eva-manager token 2>/dev/null) &&
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status)" = 401 ] &&
              s=$(curl -fsS -H "Authorization: Bearer $tok" http://127.0.0.1:8080/api/status) &&
              echo "$s" | grep -q '"api":true'; then
              echo "$s"
              exit 0
            fi
            sleep 1
          done
          echo "$s"
          docker logs eva
          exit 1
      # AmneziaWG в контейнере: права только у eva-awg, iptables и сокеты
      # от пользователя eva, интерфейс и NAT появляются на хосте.
      - name: AmneziaWG в контейнере
        run: |
          docker run -d --name eva-awg --network host --cap-add NET_ADMIN --device /dev/net/tun \
            -e EVA_LISTEN=127.0.0.1:8081 eva-manager:ci
          sleep 2
          docker exec eva-awg eva-manager awg add --host 127.0.0.1 --port 51999
          docker exec eva-awg eva-manager user add --name ci
          docker exec eva-awg eva-manager user conf --name ci | grep -q '^Jc = '
          tok=$(docker exec eva-awg eva-manager token)
          for i in $(seq 1 40); do
            if s=$(curl -fsS -H "Authorization: Bearer $tok" http://127.0.0.1:8081/api/status) &&
              echo "$s" | jq -e '.awg[0].running' >/dev/null &&
              ip link show awg0 >/dev/null 2>&1 &&
              sudo iptables -t nat -S POSTROUTING | grep -q '10.8.0.0/24'; then
              echo "$s" | jq .awg
              exit 0
            fi
            sleep 1
          done
          echo "$s"
          docker logs eva-awg
          exit 1

  install:
    name: install.sh (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Архив выпуска
        run: |
          (cd web && npm ci && npm run build)
          scripts/dist.sh 0.0.0-ci amd64 "$RUNNER_TEMP/dist"
      # Настоящий systemd раннера: служба от eva с правами на сеть, токен
      # первого запуска, мастер настройки, AmneziaWG с NAT, обновление
      # поверх и удаление с сохранением данных.
      - name: Установка
        run: |
          sudo sh install.sh --file "$RUNNER_TEMP/dist/eva-manager_0.0.0-ci_linux_amd64.tar.gz"
          systemctl status eva-manager --no-pager
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value eva-manager)")" = eva
          tok=$(sudo eva-manager token)
          curl -fsS -c jar -H 'Content-Type: application/json' -H 'X-Eva-Request: 1' \
            -d "{\"token\":\"$tok\",\"username\":\"admin\",\"password\":\"ci-password-123\"}" \
            http://127.0.0.1:8080/api/setup
          curl -fsS -b jar http://127.0.0.1:8080/api/me | grep -q '"admin"'
      - name: Xray и AmneziaWG под службой
        run: |
          sudo eva-manager inbound add --name CI --host 127.0.0.1 --port 443
          sudo eva-manager awg add --host 127.0.0.1 --port 51999
          sudo eva-manager user add --name ci
          sudo eva-manager apply
          tok=$(sudo eva-manager token)
          for i in $(seq 1 40); do
            if s=$(curl -fsS -H "Authorization: Bearer $tok" http://127.0.0.1:8080/api/status) &&
              echo "$s" | jq -e '.xray.running and .awg[0].running' >/dev/null &&
              sudo ss -ltn | grep -q ':443 ' &&
              ip link show awg0 >/dev/null 2>&1 &&
              sudo iptables -t nat -S POSTROUTING | grep -q '10.8.0.0/24'; then
              echo "$s" | jq '{xray, awg}'
              exit 0
            fi
            sleep 1
          done
          echo "$s"
          sudo journalctl -u eva-manager -n 80 --no-pager
          exit 1
      - name: Обновление и удаление
        run: |
          sudo sh install.sh --file "$RUNNER_TEMP/dist/eva-manager_0.0.0-ci_linux_amd64.tar.gz" | tee up.log
          grep -q 'обновлён' up.log
          sudo eva-manager user list | grep -q ci
          sudo sh install.sh --uninstall
          if systemctl is-active --quiet eva-manager || ip link show awg0 2>/dev/null; then
            echo "::error::после удаления служба или awg0 остались"
            exit 1
          fi
          sudo test -f /var/lib/eva-manager/eva.db
